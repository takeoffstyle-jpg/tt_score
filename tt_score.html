<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卓球スコア SimpleCloud</title>
    <style>
        :root {
            --player1-bg: #ffebee; --player1-accent: #f44336;
            --player2-bg: #e3f2fd; --player2-accent: #2196f3;
            --serve-color: #ffd700;
        }
        body { font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: #333; color: #333; overflow: hidden; }
        .header { display: flex; justify-content: space-between; background: #222; padding: 8px; }
        .header button { background: #444; color: white; border: none; padding: 8px 12px; border-radius: 4px; }
        .match-area { display: flex; flex: 0 0 50%; background: #fff; }
        .player-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; position: relative; border-right: 1px solid #ccc; }
        .p1 { background-color: var(--player1-bg); }
        .p2 { background-color: var(--player2-bg); }
        .serve-indicator { height: 24px; font-size: 12px; font-weight: bold; padding: 2px 10px; border-radius: 12px; visibility: hidden; }
        .serving .serve-indicator { visibility: visible; background: var(--serve-color); }
        .player-name { width: 85%; font-size: 18px; font-weight: bold; text-align: center; border: none; background: transparent; border-bottom: 2px solid #ccc; }
        .score-display { font-size: 90px; font-weight: bold; line-height: 1; }
        .set-count { font-size: 24px; font-weight: bold; color: #555; }
        .add-btn { width: 80%; height: 60px; font-size: 24px; font-weight: bold; border: none; border-radius: 10px; color: white; }
        .p1 .add-btn { background-color: var(--player1-accent); }
        .p2 .add-btn { background-color: var(--player2-accent); }
        .history-container { flex: 1; overflow-y: auto; background: #fafafa; padding: 10px; border-top: 2px solid #444; }
        .history-item { display: flex; justify-content: space-between; padding: 4px 8px; margin-bottom: 2px; background: white; font-size: 12px; border-bottom: 1px solid #ddd; }
        .footer { display: flex; padding: 8px; background: #222; gap: 10px; }
        .footer button { flex: 1; padding: 12px; border: none; border-radius: 4px; background: #00897b; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <button onclick="undo()">⬅ 戻る</button>
        <button onclick="redo()">進む ➡</button>
        <button onclick="resetAll()" style="background:#c62828;">リセット</button>
    </div>

    <div class="match-area">
        <div id="zone1" class="player-zone p1">
            <div class="serve-indicator">SERVE 🏓</div>
            <input type="text" id="name1" class="player-name" value="選手A">
            <div id="score1" class="score-display">0</div>
            <div class="set-count" id="sets1">0</div>
            <button class="add-btn" onclick="addPoint(1)">+1</button>
            <button onclick="setInitialServer(1)" style="font-size:10px; border:none; background:none;">最初のサーブ</button>
        </div>
        <div id="zone2" class="player-zone p2">
            <div class="serve-indicator">SERVE 🏓</div>
            <input type="text" id="name2" class="player-name" value="選手B">
            <div id="score2" class="score-display">0</div>
            <div class="set-count" id="sets2">0</div>
            <button class="add-btn" onclick="addPoint(2)">+1</button>
            <button onclick="setInitialServer(2)" style="font-size:10px; border:none; background:none;">最初のサーブ</button>
        </div>
    </div>

    <div class="history-container" id="history"></div>

    <div class="footer">
        <button onclick="exportData()">保存用テキスト出力</button>
        <button onclick="importData()">テキストから読込</button>
    </div>

    <script>
        let state = { score1: 0, score2: 0, sets1: 0, sets2: 0, initialServer: null, history: [] };
        let undoStack = []; let redoStack = [];

        function saveToUndo() { undoStack.push(JSON.stringify(state)); }

        function updateUI() {
            document.getElementById('score1').innerText = state.score1;
            document.getElementById('score2').innerText = state.score2;
            document.getElementById('sets1').innerText = state.sets1;
            document.getElementById('sets2').innerText = state.sets2;
            const server = calculateServer();
            document.getElementById('zone1').classList.toggle('serving', server === 1);
            document.getElementById('zone2').classList.toggle('serving', server === 2);
            const historyDiv = document.getElementById('history');
            historyDiv.innerHTML = state.history.slice().reverse().map(h => 
                `<div class="history-item"><span>${h.time}</span><span>${h.msg}</span><span>${h.res}</span></div>`
            ).join('');
        }

        function calculateServer() {
            if (!state.initialServer) return null;
            const total = state.score1 + state.score2;
            const isDeuce = (state.score1 >= 10 && state.score2 >= 10);
            const interval = isDeuce ? 1 : 2;
            return (Math.floor(total / interval) % 2 === 0) ? state.initialServer : (3 - state.initialServer);
        }

        function addPoint(p) {
            saveToUndo(); redoStack = [];
            if (p === 1) state.score1++; else state.score2++;
            addLog(document.getElementById('name' + p).value + " 得点", `${state.score1}-${state.score2}`);
            checkSet(); updateUI();
        }

        function checkSet() {
            if ((state.score1 >= 11 || state.score2 >= 11) && Math.abs(state.score1 - state.score2) >= 2) {
                if (state.score1 > state.score2) state.sets1++; else state.sets2++;
                addLog("--- セット終了 ---", `${state.score1}-${state.score2}`);
                state.score1 = 0; state.score2 = 0;
                if (state.initialServer) state.initialServer = 3 - state.initialServer;
            }
        }

        function addLog(msg, res) {
            const now = new Date();
            const time = now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0') + ":" + String(now.getSeconds()).padStart(2, '0');
            state.history.push({ time, msg, res });
        }

        function undo() { if (undoStack.length) { redoStack.push(JSON.stringify(state)); state = JSON.parse(undoStack.pop()); updateUI(); } }
        function redo() { if (redoStack.length) { undoStack.push(JSON.stringify(state)); state = JSON.parse(redoStack.pop()); updateUI(); } }
        function setInitialServer(p) { saveToUndo(); state.initialServer = p; updateUI(); }
        function resetAll() { if (confirm("リセットしますか？")) { state = { score1: 0, score2: 0, sets1: 0, sets2: 0, initialServer: null, history: [] }; updateUI(); } }

        // --- 独自テキストフォーマットのセーブ・ロード ---

        function exportData() {
            const n1 = document.getElementById('name1').value;
            const n2 = document.getElementById('name2').value;
            
            // 人間が見やすいフォーマットを作成
            let txt = `[TT_SCORE_v3]\n`;
            txt += `PLAYERS|${n1}|${n2}\n`;
            txt += `SETS|${state.sets1}|${state.sets2}\n`;
            txt += `POINTS|${state.score1}|${state.score2}\n`;
            txt += `SERVER|${state.initialServer}\n`;
            txt += `HISTORY_START\n`;
            state.history.forEach(h => {
                txt += `${h.time},${h.msg},${h.res}\n`;
            });
            txt += `HISTORY_END`;

            // クリップボードにコピー
            const textArea = document.createElement("textarea");
            textArea.value = txt;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            
            alert("独自形式のテキストをクリップボードにコピーしました！\nこれをLINEやメモ帳に貼り付けて保存してください。");
        }

        function importData() {
            const input = prompt("保存したテキストをここに貼り付けてください:");
            if (!input || !input.includes("[TT_SCORE_v3]")) {
                alert("有効なデータではありません");
                return;
            }

            try {
                const lines = input.split("\n");
                let newHistory = [];
                let inHistory = false;

                lines.forEach(line => {
                    const parts = line.split("|");
                    if (line.startsWith("PLAYERS")) {
                        document.getElementById('name1').value = parts[1];
                        document.getElementById('name2').value = parts[2];
                    } else if (line.startsWith("SETS")) {
                        state.sets1 = parseInt(parts[1]);
                        state.sets2 = parseInt(parts[2]);
                    } else if (line.startsWith("POINTS")) {
                        state.score1 = parseInt(parts[1]);
                        state.score2 = parseInt(parts[2]);
                    } else if (line.startsWith("SERVER")) {
                        state.initialServer = parts[1] === "null" ? null : parseInt(parts[1]);
                    } else if (line.startsWith("HISTORY_START")) {
                        inHistory = true;
                    } else if (line.startsWith("HISTORY_END")) {
                        inHistory = false;
                    } else if (inHistory) {
                        const hParts = line.split(",");
                        if (hParts.length === 3) {
                            newHistory.push({ time: hParts[0], msg: hParts[1], res: hParts[2] });
                        }
                    }
                });
                state.history = newHistory;
                updateUI();
                alert("読み込みが完了しました！");
            } catch (e) {
                alert("読み込み中にエラーが発生しました");
            }
        }

        updateUI();
    </script>
</body>
</html>
